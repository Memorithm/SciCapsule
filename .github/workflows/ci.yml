name: CI (pull requests)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  quality-and-msrv:
    if: github.event.pull_request.draft == false
    # The workflow and any checked-out PR code always run on a fresh hosted VM.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_HOME: ${{ github.workspace }}/target/cargo-home
      TMPDIR: ${{ github.workspace }}/target/tmp
      RUSTUP_HOME: ${{ github.workspace }}/target/rustup-home
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate proposed workflow YAML
        run: |
          set -euo pipefail
          # This parser is in the base-controlled pull_request_target workflow;
          # candidate edits cannot replace its checks on subsequent PRs.
          ruby <<'RUBY'
          require 'yaml'
          def workflow_document(bytes)
            stream = YAML.parse_stream(bytes)
            raise 'workflow must contain exactly one YAML document' unless stream.children.length == 1
            document = YAML.safe_load(bytes, aliases: true)
            raise 'workflow must be a mapping' unless document.is_a?(Hash)
            document
          end
          raise 'positive parser control failed' unless workflow_document("name: positive\njobs: {}\n").is_a?(Hash)
          negatives = ['', "name: first\n---\nname: second\n", "name: first\n---\nmalformed: [\n", "[one, two]\n", "name: [\n"]
          negatives.each_with_index do |bytes, index|
            refused = false
            begin
              workflow_document(bytes)
            rescue Psych::Exception, RuntimeError
              refused = true
            end
            raise "negative parser control #{index} was accepted" unless refused
          end
          puts 'BASE_WORKFLOW_YAML_FULL_STREAM_POSITIVE_AND_5_NEGATIVES_OK'
          paths = Dir['.github/workflows/*.{yml,yaml}'].sort
          abort 'invalid workflow inventory' if paths.empty? || paths.length > 64
          paths.each do |path|
            abort "workflow too large: #{path}" if File.size(path) > 1024 * 1024
            workflow_document(File.read(path))
            puts "validated #{path}"
          end
          RUBY
      - name: Prepare writable toolchain and temporary directories
        run: mkdir -p "$CARGO_HOME" "$TMPDIR" "$RUSTUP_HOME"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check stable
        run: cargo check --locked --all-targets
      - name: Clippy stable
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests stable
        run: cargo test --locked --all-targets
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Check MSRV 1.89
        run: cargo +1.89.0 check --locked --all-targets
