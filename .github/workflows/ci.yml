name: CI (pull requests)

on:
  # pull_request is retained only to validate this bootstrap PR. A follow-up
  # installation probe removes it after pull_request_target is live on main.
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  quality-and-msrv:
    if: github.event.pull_request.draft == false
    # The workflow and any checked-out PR code always run on a fresh hosted VM.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_HOME: ${{ github.workspace }}/target/cargo-home
      TMPDIR: ${{ github.workspace }}/target/tmp
      RUSTUP_HOME: ${{ github.workspace }}/target/rustup-home
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare writable toolchain and temporary directories
        run: mkdir -p "$CARGO_HOME" "$TMPDIR" "$RUSTUP_HOME"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check stable
        run: cargo check --locked --all-targets
      - name: Clippy stable
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests stable
        run: cargo test --locked --all-targets
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Check MSRV 1.89
        run: cargo +1.89.0 check --locked --all-targets
