name: CI (internal main)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-msrv:
    # This workflow cannot be triggered by a pull request. It qualifies only
    # code that has already been merged into main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_HOME: ${{ github.workspace }}/target/cargo-home
      TMPDIR: ${{ github.workspace }}/target/tmp
      RUSTUP_HOME: ${{ github.workspace }}/target/rustup-home
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Prepare writable toolchain and temporary directories
        run: mkdir -p "$CARGO_HOME" "$TMPDIR" "$RUSTUP_HOME"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check stable
        run: cargo check --locked --all-targets
      - name: Clippy stable
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests stable
        run: cargo test --locked --all-targets
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Check MSRV 1.89
        run: cargo +1.89.0 check --locked --all-targets
